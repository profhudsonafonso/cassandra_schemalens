# Single-node RESEARCH development only. RF=1 does NOT satisfy official TPCx-IoT replication rules.
services:
  cassandra:
    image: cassandra:4.1.8
    container_name: schemalens_tpcx_cassandra
    restart: unless-stopped
    ports:
      - '127.0.0.1:9042:9042'
    environment:
      CASSANDRA_CLUSTER_NAME: SchemaLens-Stage9-Research
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 192M
    volumes:
      - schemalens_cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ['CMD-SHELL','cqlsh 127.0.0.1 9042 -e "SELECT release_version FROM system.local;" >/dev/null 2>&1']
      interval: 20s
      timeout: 10s
      retries: 25
      start_period: 90s
volumes:
  schemalens_cassandra_data:
